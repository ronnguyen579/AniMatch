services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: animatch
      POSTGRES_PASSWORD: animatch_dev
      POSTGRES_DB: animatch
    ports: ["5432:5432"]
    volumes: ["animatch_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animatch -d animatch"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  animatch_pg:
